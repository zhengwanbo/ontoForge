# Oracle 本体构建平台前端 Nginx 配置
#
# 部署前请确认：
# 1. 将 `frontend/dist/` 发布到 /opt/ontoforge/frontend/dist/；
# 2. FastAPI/Uvicorn 监听在 127.0.0.1:8000；
# 3. 按实际域名修改 server_name，并按需在 HTTPS server 块中配置证书。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/ontoforge/frontend/dist;
    index index.html;

    # 单页应用路由：如 /business/ontology 由前端 Vue Router 处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建出的带指纹资源可长期缓存；HTML 不缓存，以便及时获取新版本入口。
    location ~* ^/assets/.*\.(?:js|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端统一调用 /api/v1；将 API 保持原路径代理到 FastAPI。
    # DDL、LLM 等接口可能耗时较长，读取超时设置为 10 分钟。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # FastAPI 健康检查透传，便于由负载均衡或运维探针调用。
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
